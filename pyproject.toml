[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "layer-orchestrator-v1"
version = "0.1.0"
description = "FastAPI orchestrator for HTTP RAG and chat-completions gateway."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "python-dotenv",
  "langchain-community",
  "langchain-openai",
  "langsmith",
  "langgraph",
  "httpx",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-asyncio",
]
